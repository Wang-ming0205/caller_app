{% extends "base.html" %}
{% block content %}
<style>
  .customer-summary {
    display: grid;
    gap: 14px;
  }

  .customer-summary-header {
    padding: 16px;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    background: #eff6ff;
  }

  .customer-summary-header h3 {
    margin: 0 0 6px;
  }

  .customer-summary-header p {
    margin: 0;
  }

  .customer-summary-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .customer-summary-stat {
    padding: 16px;
    border-radius: 12px;
    background: #f1f5f9;
  }

  .customer-summary-stat span {
    display: block;
    color: #64748b;
    margin-bottom: 5px;
  }

  .customer-summary-stat strong {
    font-size: 20px;
  }

  .customer-history-list {
    display: grid;
    gap: 10px;
  }

  .customer-history-entry {
    border: 1px solid #dbeafe;
    border-radius: 12px;
    background: white;
    overflow: hidden;
  }

  .customer-history-entry summary {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 14px;
    cursor: pointer;
    background: #f8fafc;
  }

  .customer-history-entry summary:hover {
    background: #eff6ff;
  }

  .customer-history-detail {
    padding: 14px;
    border-top: 1px solid #e2e8f0;
  }

  .customer-history-detail table {
    width: 100%;
    margin-top: 10px;
  }

  .customer-history-note {
    margin: 10px 0 0;
    color: #475569;
  }

  .customer-summary-empty {
    padding: 16px;
    border-radius: 12px;
    background: #f8fafc;
    color: #64748b;
  }

  @media (max-width: 700px) {
    .customer-summary-stats {
      grid-template-columns: 1fr;
    }

    .customer-history-entry summary {
      grid-template-columns: 1fr;
    }
  }
  .history-arrow {
  display: inline-block;
  margin-right: 6px;
  font-size: 12px;
  transition: transform 0.2s ease;  
  }

  .customer-history-entry[open]
  .history-arrow {
    transform: rotate(90deg);
  }

.customer-list {
  display: grid;
  gap: 14px;
  margin-top: 18px;
}

.customer-card {
  padding: 16px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  background: white;
}

.customer-card-title h3 {
  margin: 0 0 5px;
}

.customer-card-fields {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 14px;
}

.customer-field {
  min-width: 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: #f8fafc;
}

.customer-field span {
  display: block;
  margin-bottom: 4px;
  color: #64748b;
  font-size: 13px;
}

.customer-field strong {
  display: block;
  overflow-wrap: anywhere;
}

.customer-card-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.delete-button {
  background: #dc2626;
}

.customer-list-empty {
  padding: 18px;
  border-radius: 12px;
  background: #f8fafc;
  color: #64748b;
  text-align: center;
}

/* 手機版 */
@media (max-width: 700px) {
  .customer-card-fields {
    grid-template-columns: 1fr 1fr;
  }

  .customer-card-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .customer-card-actions button {
    width: 100%;
    padding-left: 6px;
    padding-right: 6px;
  }
}

@media (max-width: 420px) {
  .customer-card-fields {
    grid-template-columns: 1fr;
    }
  }

</style>

<div class="card">
  <h2>客戶查詢</h2>

  <div class="row">
    <input
      id="q"
      placeholder="輸入客戶 ID、姓名或手機末三／四碼"
      onkeydown="
        if (event.key === 'Enter') {
          searchCustomers();
        }
      "
    >

    <button onclick="searchCustomers()">
      查詢
    </button>

    <button onclick="loadLatestCustomers()">
      最新五筆
    </button>

    <button onclick="exportCustomersCsv()">
      匯出 CSV
    </button>
  </div>

{#  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>姓名</th>
        <th>手機</th>
        <th>性別</th>
        <th>生日</th>
        <th>備註</th>
        <th>操作</th>
      </tr>
    </thead>

    <tbody id="customer-table"></tbody>
  </table>#}


<div
  id="customer-list"
  class="customer-list"
></div>

<!--
  template 不會直接顯示。
  app.js 取得客戶資料後，會複製這張卡片。
-->
  <template id="customer-card-template">
    <article class="customer-card">

      <div class="customer-card-title">
        <div>
          <h3 data-field="name"></h3>

          <span class="hint">
            ID：
            <span data-field="id"></span>
          </span>
        </div>
      </div>

      <div class="customer-card-fields">

        <div class="customer-field">
          <span>手機</span>
          <strong data-field="phone"></strong>
        </div>

        <div class="customer-field">
          <span>性別</span>
          <strong data-field="gender"></strong>
        </div>

        <div class="customer-field">
          <span>生日</span>
          <strong data-field="birthday"></strong>
        </div>

        <div class="customer-field">
          <span>備註</span>
          <strong data-field="note"></strong>
        </div>

      </div>

      <div class="customer-card-actions">
        <button
          type="button"
          data-action="edit"
        >
          編輯
        </button>

        <button
          type="button"
          class="secondary"
          data-action="summary"
        >
          摘要
        </button>

        <button
          type="button"
          class="delete-button"
          data-action="delete"
        >
          刪除
        </button>
      </div>

    </article>
  </template>

</div>

<div class="card">
  <h2>會員摘要</h2>

  <div
    id="summary-result"
    class="customer-summary"
  >
    <p class="hint">
      點「摘要」查看總消費與最近五筆消費紀錄。
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  initHome();
</script>
{% endblock %}
