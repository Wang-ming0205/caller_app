{% extends "base.html" %}
{% block content %}
<section class="card p-4" style="max-width: 680px">
  <h2>預約</h2>

  <form id="guest-booking-form">
    <fieldset>
      <label class="form-label" for="guest-lookup-last3">手機末三碼</label>
      <input class="form-control mb-3" id="guest-lookup-last3" type="text"
             inputmode="numeric" pattern="[0-9]{3}" maxlength="3"
             placeholder="例如：007" required>

      <label class="form-label" for="guest-lookup-birthday">生日</label>
      <input class="form-control mb-3" id="guest-lookup-birthday"
             type="date" required>

      <label class="form-label" for="guest-lookup-customer">姓名</label>
      <select class="form-select mb-3" id="guest-lookup-customer" required disabled>
        <option value="">請先輸入手機末三碼和生日</option>
      </select>

      <label class="form-label" for="guest-starts-at">預約時間</label>
      <input class="form-control mb-3" id="guest-starts-at"
             type="datetime-local" required>

      <label class="form-label" for="guest-service">服務項目</label>
      <input class="form-control mb-3" id="guest-service"
             maxlength="100" placeholder="例如：剪髮" required>

      <div class="d-flex flex-wrap gap-2">
        <button id="guest-booking-button" class="btn btn-primary"
                type="submit" disabled>送出預約</button>
        <button id="guest-lookup-button" class="btn btn-outline-primary"
                type="button" disabled>查詢我的預約</button>
      </div>
    </fieldset>
  </form>

  <details class="mt-4">
    <summary>首次來店預約</summary>
    <form id="guest-first-booking-form" class="mt-3">
      <fieldset>
        <label class="form-label" for="guest-name">姓名</label>
        <input class="form-control mb-3" id="guest-name" name="name"
               autocomplete="name" maxlength="100" required>

        <label class="form-label" for="guest-phone">手機號碼</label>
        <input class="form-control mb-3" id="guest-phone" name="phone_number"
               type="tel" autocomplete="tel" placeholder="0912345678" required>

        <label class="form-label" for="guest-birthday">生日</label>
        <input class="form-control mb-3" id="guest-birthday" name="birthday"
               type="date" required>

        <label class="form-label" for="guest-first-starts-at">預約時間</label>
        <input class="form-control mb-3" id="guest-first-starts-at" name="starts_at"
               type="datetime-local" required>

        <label class="form-label" for="guest-first-service">服務項目</label>
        <input class="form-control mb-3" id="guest-first-service" name="service_name"
               maxlength="100" placeholder="例如：剪髮" required>

        <button class="btn btn-primary" type="submit">送出首次預約</button>
      </fieldset>
    </form>
  </details>

  <section class="mt-4 border-top pt-3" aria-labelledby="guest-appointments-heading">
    <h3 id="guest-appointments-heading">我的預約</h3>
    <p id="guest-result-message" class="mt-3" role="status"></p>
    <div id="guest-appointments" class="d-grid gap-2"></div>
  </section>
</section>

<script src="/static/js/reservation.js?v=20261123-1"></script>
{% endblock %}
