{% extends "base.html" %}
{% block content %}
<style>
  .transaction-page {
    max-width: 1100px;
    margin: 0 auto;
  }

  .transaction-section {
    width: 100%;
  }

  .transaction-section h2 {
    margin-bottom: 6px;
  }

  .category-buttons,
  .service-buttons,
  .length-buttons {
    display: grid;
    gap: 10px;
    margin: 16px 0;
  }

  .category-buttons {
    grid-template-columns: repeat(4, 1fr);
  }

  .service-buttons {
    grid-template-columns: repeat(3, 1fr);
  }

  .length-buttons {
    grid-template-columns: repeat(5, 1fr);
  }

  .category-buttons button {
    min-height: 62px;
    font-size: 20px;
    font-weight: 700;
  }

  .service-buttons button,
  .length-buttons button {
    min-height: 52px;
  }

  .category-buttons button.selected,
  .service-buttons button.selected,
  .length-buttons button.selected {
    background: #0f766e;
    color: white;
    outline: 3px solid #99f6e4;
  }

  .selection-panel {
    margin-top: 18px;
    padding: 16px;
    border: 1px solid #dbeafe;
    border-radius: 12px;
    background: #f8fafc;
  }

  .selection-panel h3 {
    margin-top: 0;
  }

  .selected-service-summary {
    padding: 12px;
    margin: 12px 0;
    border-radius: 10px;
    background: #ecfeff;
    font-weight: 700;
  }

  .hidden {
    display: none !important;
  }

  .amount-summary {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 18px;
  }

  .amount-summary p {
    flex: 1;
    padding: 18px;
    margin: 0;
    border-radius: 12px;
    background: #eff6ff;
    font-size: 20px;
    font-weight: 700;
  }

  .save-transaction-button {
    width: 100%;
    margin-top: 16px;
  }

  .current-items-table-wrap {
    width: 100%;
    overflow-x: auto;
  }

  @media (max-width: 760px) {
    .category-buttons {
      grid-template-columns: repeat(2, 1fr);
    }

    .service-buttons {
      grid-template-columns: repeat(2, 1fr);
    }

    .length-buttons {
      grid-template-columns: repeat(2, 1fr);
    }

    .amount-summary {
      flex-direction: column;
    }
  }
</style>

<section class="transaction-page">

  <!-- DIV 1：查詢客戶 -->
  <div class="card transaction-section">
    <h2>查詢客戶</h2>

    <p class="hint">
      輸入客戶手機，確認客戶後才能新增消費。
    </p>

    <label for="tx_phone_number">客戶手機 *</label>

    <input
      id="tx_phone_number"
      placeholder="0912345678"
      oninput="clearVerifiedTransactionCustomer()"
      onkeydown="
        if (event.key === 'Enter') {
          findTransactionCustomer();
        }
      "
      required
    >

    <input id="customer_id" type="hidden">

    <button
      type="button"
      onclick="findTransactionCustomer()"
    >
      查詢客戶
    </button>

    <p
      id="transaction-customer-result"
      class="message hidden"
    ></p>
  </div>

  <!-- DIV 2：快速選擇 -->
  <div class="card transaction-section">
    <h2>快速選擇</h2>

    <p class="hint">
      先選服務分類，再選療程及髮長；價格會自動帶入，也可以手動修改。
    </p>

    <section class="category-buttons">
      <button type="button" data-category="剪"
              onclick="selectServiceCategory('剪', this)">
        剪
      </button>

      <button type="button" data-category="洗"
              onclick="selectServiceCategory('洗', this)">
        洗
      </button>

      <button type="button" data-category="染"
              onclick="selectServiceCategory('染', this)">
        染
      </button>

      <button type="button" data-category="燙"
              onclick="selectServiceCategory('燙', this)">
        燙
      </button>

      <button type="button" data-category="護髮"
              onclick="selectServiceCategory('護髮', this)">
        護髮
      </button>

      <button type="button" data-category="頭皮"
              onclick="selectServiceCategory('頭皮', this)">
        頭皮
      </button>

      <button type="button" data-category="臉部"
              onclick="selectServiceCategory('臉部', this)">
        臉部
      </button>

      <button type="button" data-category="其他"
              onclick="selectServiceCategory('其他', this)">
        其他
      </button>
    </section>

    <div id="service-selection-panel" class="selection-panel hidden">
      <h3>選擇服務</h3>
      <div id="service-buttons" class="service-buttons"></div>
    </div>

    <div id="length-selection-panel" class="selection-panel hidden">
      <h3>選擇髮長／規格</h3>
      <div id="length-buttons" class="length-buttons"></div>
    </div>

    <div id="selected-service-summary"
         class="selected-service-summary hidden">
    </div>

    <label for="item_name">本次項目 *</label>
    <input
      id="item_name"
      placeholder="請先選擇分類與服務"
      readonly
    >

    <label for="item_description">描述</label>
    <input
      id="item_description"
      placeholder="例如：補染髮根、自然捲、指定甜橙精油"
    >

    <label for="qty">數量 *</label>
    <input
      id="qty"
      type="number"
      value="1"
      min="1"
      required
    >

    <label for="unit_price">價格 *</label>
    <input
      id="unit_price"
      type="number"
      value="0"
      min="0"
      required
    >

    <p class="hint">
      標示「起」的項目會先帶入最低價格，現場可依實際情況修改。
    </p>

    <button
      type="button"
      onclick="addTransactionItem()"
    >
      加入此次消費
    </button>
  </div>

  <!-- DIV 3：消費紀錄 -->
  <div class="card transaction-section">
    <h2>本次消費</h2>

    <div class="current-items-table-wrap">
      <table>
        <thead>
          <tr>
            <th>項目</th>
            <th>數量</th>
            <th>金額</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody id="current-items-table">
          <tr>
            <td colspan="4">尚未加入消費項目</td>
          </tr>
        </tbody>
      </table>
    </div>

    <section class="amount-summary">
      <p>
        此次消費：
        <span id="current-spending">NT$ 0</span>
      </p>

      <p>
        總消費：
        <span id="total-spending">NT$ 0</span>
      </p>
    </section>

    <label for="tx_note">整筆消費備註</label>
    <textarea
      id="tx_note"
      placeholder="本次消費的整體備註"
    ></textarea>

    <button
      type="button"
      class="save-transaction-button"
      onclick="createTransaction()"
    >
      儲存本次消費
    </button>
  </div>

</section>
{% endblock %}

{% block scripts %}
<script>
  initTransactionsPage();
</script>
{% endblock %}
