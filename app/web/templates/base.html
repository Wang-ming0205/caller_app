<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Barbershop CRM" }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Barbershop CRM</div>
    <nav>
      <a href="/">首頁</a>
      <a href="/customers">客戶管理</a>
      <a href="/customers/new">新增客戶</a>
      <a href="/transactions">新增消費</a>
      <a href="/items">消費項目</a>
      <a href="/users">人員管理</a>
      <a href="/account">帳號設定</a>
      <a href="/docs" target="_blank">API 文件</a>
    </nav>
    <button class="ghost" onclick="logout()">登出</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>{{ title or "Barbershop CRM" }}</h1>
        <p id="login-status">檢查登入狀態中...</p>
      </div>
      <a class="btn" href="/login">登入</a>
    </header>

    <section id="message" class="message hidden"></section>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
