<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Barbershop CRM" }}</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css?v=20260830">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Barbershop CRM</div>
    <nav>
      <a href="/">首頁</a>
      <a href="/customers">客戶管理</a>
      <a href="/customers/new">新增客戶</a>
      <a href="/transactions">新增消費</a>
      <a href="/users">人員管理</a>
      <a href="/account">帳號設定</a>
      {#<a href="/docs" target="_blank">API 文件</a>#}
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>{{ title or "Barbershop CRM" }}</h1>
        <p id="login-status">檢查登入狀態中...</p>
      </div>

      <div class="d-flex align-items-center gap-1">
        <button
          id="auth-btn"
          class="btn"
          type="button"
          onclick="handleAuthButton()"
        >登入</button>

        <button
          id="admin-reset-trigger"
          class="btn btn-sm"
          type="button"
          title="系統工具"
          aria-label="Admin 系統工具"
          onclick="handleAdminResetTrigger()"
          style="opacity:.28; padding:.15rem .35rem; line-height:1;"
          hidden
        >⚙</button>
      </div>
    </header>

    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/sweetalert2.all.min.js?v=20260607"></script>
  <script src="/static/js/app.js?v=20260906"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
